# CI Workflow for Sphinx Protocol
# Runs on every push and pull request to ensure code quality
# Note: GUI packages require Fyne dependencies
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install system dependencies for Fyne/GUI
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxxf86vm-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Run go fmt
        run: go fmt ./...

      - name: Run go vet
        run: go vet ./...

      # NOTE: the default `go test` timeout is 10m PER PACKAGE. SPHINCS+ key
      # generation and signing dominate the wall clock here: the custody tests
      # in src/core sign real STHINCS signatures, and under -race each one
      # costs several seconds. When that cost was paid once per test instead of
      # once per package, src/core blew past 30m and got SIGQUIT'd — which
      # looked like a data race in the log, because SIGQUIT dumps every
      # goroutine, most of them sitting in Spx_sign/SHA256. The ceiling is 60m
      # so a genuinely slow run reports a real failure instead of a misleading
      # race report.
      - name: Run tests with race detection
        run: go test -race -v -timeout 60m ./...

      - name: Verify build
        run: go build -v ./src/cli
