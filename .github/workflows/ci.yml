# CI Workflow for Sphinx Protocol
# Runs on every push and pull request to ensure code quality
# Note: GUI packages require Fyne dependencies
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install system dependencies for Fyne/GUI
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxxf86vm-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Run go fmt
        run: go fmt ./...

      - name: Run go vet
        run: go vet ./...

      # NOTE: the default `go test` timeout is 10m PER PACKAGE. src/bind's
      # SPHINCS+ crypto tests legitimately need ~10m under -race on their own,
      # so the ceiling is raised to 30m to leave headroom on slower runners.
      - name: Run tests with race detection
        run: go test -race -v -timeout 30m ./...

      - name: Verify build
        run: go build -v ./src/cli
